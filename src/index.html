<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <script src="./calculator.js" defer></script>
  <link rel="stylesheet" href="./calculator.css">
</head>
<body>
  <input type="text" readonly>

  <!--CONTROLS-->
  <div>
    <button>*</button>
    <button>/</button>
    <button>Clear</button>
  </div>
  <div>
    <button>+</button>
    <button>-</button>
    <button>=</button>
  </div>
  <div>
    <button>7</button>
    <button>8</button>
    <button>9</button>
  </div>
  <div>
    <button>4</button>
    <button>5</button>
    <button>6</button>
  </div>
  <div>
    <button>1</button>
    <button>2</button>
    <button>3</button>
  </div>
  <div>
    <button>0</button>
  </div>
</body>
</html>
